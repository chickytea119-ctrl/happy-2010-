<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20-10 Celebration 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #01040a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            position: relative;
        }

        /* Lớp nền sau cùng: Hình cặp đôi nét line chân thực, ôm nhau uyển chuyển nằm phía sau */
        .bg-line-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .line-scene {
            width: 440px;
            height: 440px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.5; /* Độ sáng vừa phải, nổi bật chân thực nhưng không lấn át trái tim 3D */
        }

        /* Tinh chỉnh hình dáng chi tiết chân thực cho cặp đôi ôm nhau */
        .line-couple {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            fill: none;
            stroke: url(#cyanPinkGrad);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: coupleBreath 6s ease-in-out infinite;
        }

        .line-bg-heart {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            fill: none;
            stroke: #ff66b2;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: heartPopLine 6s ease-in-out infinite;
        }

        @keyframes coupleBreath {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.03); }
        }

        @keyframes heartPopLine {
            0%, 35% { transform: translateX(-50%) scale(0); opacity: 0; }
            45%, 75% { transform: translateX(-50%) scale(1.35); opacity: 1; }
            85%, 100% { transform: translateX(-50%) scale(0); opacity: 0; }
        }

        /* Canvas hiển thị trái tim 3D hạt thưa và hiệu ứng pháo hoa nằm đè phía trên */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .content-box {
            position: absolute;
            bottom: 30px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            padding: 15px 20px;
            background: rgba(2, 12, 27, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(0, 191, 255, 0.25);
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.2);
        }

        h1 {
            color: #00d2ff;
            font-size: 1.2rem;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
            letter-spacing: 1px;
            font-weight: 600;
        }

        p {
            color: #d1f2ff;
            font-size: 0.85rem;
            line-height: 1.5;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- Nền phía sau: Cặp đôi nét line chân thực ôm nhau thắm thiết -->
    <div class="bg-line-container">
        <div class="line-scene">
            <svg width="0" height="0">
                <defs>
                    <linearGradient id="cyanPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00d2ff" />
                        <stop offset="100%" stop-color="#ff66b2" />
                    </linearGradient>
                </defs>
            </svg>

            <!-- Trái tim nhỏ phập phồng phía sau cặp đôi -->
            <svg class="line-bg-heart" width="40" height="40" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>

            <!-- Hình ảnh cặp đôi ôm nhau chi tiết chân thực (Line Art Vector) -->
            <svg class="line-couple" width="160" height="180" viewBox="0 0 120 140">
                <!-- Nam (Bên trái) -->
                <path d="M45,45 C42,35 48,25 55,28 C62,31 60,42 55,48" /> <!-- Đầu / Tóc nam -->
                <circle cx="53" cy="30" r="9" /> <!-- Mặt nam -->
                <path d="M53,39 L48,75 L35,110 L25,135" /> <!-- Lưng / Thân nam -->
                <path d="M50,55 L70,75 L85,95" /> <!-- Tay nam ôm qua lưng nữ -->
                <path d="M42,75 L45,110 L48,135" /> <!-- Chân nam -->

                <!-- Nữ (Bên phải) -->
                <path d="M72,42 C78,32 70,22 62,26 C55,30 58,40 65,46" /> <!-- Tóc dài nữ -->
                <circle cx="67" cy="30" r="8.5" /> <!-- Mặt nữ -->
                <path d="M67,38 L72,70 L78,100 L85,135" /> <!-- Thân nữ -->
                <path d="M65,52 L50,72 L40,88" /> <!-- Tay nữ ôm vòng cổ nam -->
                <path d="M75,75 L70,110 L68,135" /> <!-- Chân nữ -->

                <!-- Điểm kết nối vòng tay ôm sát ngọt ngào -->
                <path d="M70,75 C60,82 50,82 40,88" />
            </svg>
        </div>
    </div>

    <!-- Canvas chứa trái tim 3D hạt thưa và pháo hoa -->
    <canvas id="heartCanvas"></canvas>

    <div class="content-box">
        <h1>20-10</h1>
        <p>Chúc em bờ vai vững chãi, trái tim dịu dàng, ngày tháng bình yên 💙</p>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            perspective = Math.min(width, height) * 0.95;
            initParticles();
        });

        let particles = [];
        let fireworks = [];
        // Số lượng hạt vừa phải giúp khối trái tim thưa thớt, thoáng đãng
        const particleCount = 5500;
        let perspective = Math.min(width, height) * 0.95;

        // Phương trình thể tích 3D định hình trái tim chuẩn xác tuyệt đối
        function isInHeart(x, y, z) {
            let ny = -y;
            let val = Math.pow(x*x + 2.25*z*z + ny*ny - 1, 3) - x*x * Math.pow(ny, 3) - 0.1125 * z*z * Math.pow(ny, 3);
            return val <= 0;
        }

        function initParticles() {
            particles = [];
            let count = 0;
            let scale = Math.min(width, height) * 0.25;

            while (count < particleCount) {
                let x = (Math.random() * 3 - 1.5);
                let y = (Math.random() * 3 - 1.5);
                let z = (Math.random() * 1.8 - 0.9);

                if (isInHeart(x, y, z)) {
                    let hue = Math.random() * 50 + 180; // Dải màu xanh cyan lam ngọc
                    let lightness = Math.random() * 35 + 50;

                    particles.push({
                        x: x * scale,
                        y: y * scale,
                        z: z * scale,
                        size: Math.random() * 0.4 + 0.18,
                        color: `hsl(${hue}, 100%, ${lightness}%)`
                    });
                    count++;
                }
            }
        }

        initParticles();

        // Hiệu ứng pháo hoa bụi sao bung tỏa 360 độ full màn hình theo nhịp đập
        function createHeartPulseBurst(centerX, centerY, rotationY) {
            const burstCount = 200;
            const cosR = Math.cos(rotationY);
            const sinR = Math.sin(rotationY);

            for (let i = 0; i < burstCount; i++) {
                let p = particles[Math.floor(Math.random() * particles.length)];
                
                let rx = p.x * cosR + p.z * sinR;
                let ry = p.y;
                let rz = -p.x * sinR + p.z * cosR;

                let fov = perspective;
                let scale3D = fov / (fov + rz);
                let startX = rx * scale3D + centerX;
                let startY = ry * scale3D + centerY;

                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 7.0 + 2.5;

                let hue = Math.random() > 0.4 ? (Math.random() * 30 + 185) : (Math.random() * 35 + 320); // Xanh cyan & Hồng lấp lánh
                let lightness = Math.random() * 35 + 60;

                fireworks.push({
                    x: startX,
                    y: startY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 0.25 + 0.08,
                    color: `hsl(${hue}, 100%, ${lightness}%)`,
                    alpha: 1.0,
                    decay: Math.random() * 0.015 + 0.008
                });
            }
        }

        let time = 0;
        let lastBeatState = false;

        function animate() {
            // Xóa nền mờ tạo vệt mềm mại
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(1, 4, 10, 0.26)';
            ctx.fillRect(0, 0, width, height);

            time += 0.015;

            // Góc xoay 3D đung đưa nhẹ nhàng tự nhiên
            let angleY = Math.sin(time * 0.5) * 0.35;
            let cosY = Math.cos(angleY);
            let sinY = Math.sin(angleY);

            // Chuyển động nhịp đập êm ái
            let beat = Math.sin(time * 1.8);
            let heartbeat = 1 + (Math.pow(Math.max(0, beat), 3) * 0.05 + Math.sin(time * 1.8 + 0.2) * 0.015);

            let centerX = width / 2;
            let centerY = height / 2 - 35;

            // Kích hoạt hiệu ứng bung tỏa khi trái tim đạt đỉnh nhịp đập
            let isBeatPeak = beat > 0.92;
            if (isBeatPeak && !lastBeatState) {
                createHeartPulseBurst(centerX, centerY, angleY);
                lastBeatState = true;
            } else if (beat < 0.3) {
                lastBeatState = false;
            }

            let projected = [];

            // Biến đổi tọa độ 3D khối trái tim
            for (let p of particles) {
                let px = p.x * heartbeat;
                let py = p.y * heartbeat;
                let pz = p.z * heartbeat;

                // Xoay 3D quanh trục Y
                let rx = px * cosY + pz * sinY;
                let ry = py;
                let rz = -px * sinY + pz * cosY;

                let fov = perspective;
                let scale3D = fov / (fov + rz);
                let screenX = rx * scale3D + centerX;
                let screenY = ry * scale3D + centerY;

                projected.push({
                    x: screenX,
                    y: screenY,
                    size: Math.max(0.1, p.size * scale3D),
                    color: p.color,
                    z: rz
                });
            }

            // Sắp xếp Z-Buffer cho độ sâu 3D
            projected.sort((a, b) => b.z - a.z);

            // Bật hiệu ứng phát sáng Neon (Additive Blending)
            ctx.globalCompositeOperation = 'lighter';

            // 1. Vẽ khối trái tim 3D hạt thưa lấp lánh
            for (let p of projected) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }

            // 2. Cập nhật và vẽ các hạt pháo hoa bung tỏa full màn hình theo nhịp đập
            for (let i = fireworks.length - 1; i >= 0; i--) {
                let fw = fireworks[i];
                fw.x += fw.vx;
                fw.y += fw.vy;

                fw.vx *= 0.982;
                fw.vy *= 0.982;

                fw.alpha -= fw.decay;

                if (fw.alpha <= 0) {
                    fireworks.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.max(0, fw.alpha);
                ctx.beginPath();
                ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
                ctx.fillStyle = fw.color;
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
